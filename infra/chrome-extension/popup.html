<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 400px; padding: 14px; margin: 0; }
    h3 { margin: 0 0 10px; }
    .row { display: flex; gap: 8px; margin-bottom: 8px; }
    button { flex: 1; padding: 9px; font-weight: 600; cursor: pointer; }
    #acquire { background: #16a34a; color: #fff; border: none; }
    #cancel { width: 100%; margin-bottom: 8px; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    #status { font-weight: 600; margin: 6px 0; min-height: 18px; }
    #status.active { color: #b45309; }
    pre { white-space: pre-wrap; word-break: break-all; background: #f4f4f5; padding: 10px;
          border-radius: 6px; font-size: 11px; line-height: 1.4; max-height: 340px; overflow: auto; }
  </style>
</head>
<body>
  <h3>LOOM Source Capture</h3>
  <div class="row">
    <button id="acquire">Acquire for Reaction</button>
  </div>
  <div class="row">
    <button id="stage1">Capture page media</button>
    <button id="stage2">Inspect Playing Media</button>
  </div>
  <div class="row">
    <button id="stage2reload">Inspect + reload Reel</button>
  </div>
  <button id="cancel" hidden>Cancel</button>
  <div id="status">Ready</div>
  <pre id="out">Open a playing Instagram Reel, then click "Acquire for Reaction".</pre>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
